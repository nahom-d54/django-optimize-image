# tox.ini
[tox]
envlist = py37-django32, py37-django42, py37-django50
    py38-django32, py38-django42, py38-django50
    py39-django32, py39-django42, py39-django50
    py310-django42, py310-django50
    py311-django42, py311-django50
    py312-django42, py312-django50
    py313-django50

[testenv]
deps =
    pytest
    pytest-django
    Pillow
    django32: Django>=3.2,<4.0
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<6.0
commands =
    pytest {posargs}

setenv =
    PYTHONPATH = {toxinidir}
    
[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
python_files = tests/test_*.py
